<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.28" stop-color="#ffb347" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#ff7b2e" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ff7b2e" stop-opacity="0"/>
    </radialGradient>
    <!-- Brighter on the left, where the disk's gas comes toward us. -->
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff3d6" stop-opacity="0.15"/>
      <stop offset="0.15" stop-color="#fff3d6"/>
      <stop offset="0.45" stop-color="#ffd59a"/>
      <stop offset="0.75" stop-color="#ff7b2e" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="face" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.35" stop-color="#ffb347" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#ffb347" stop-opacity="0.35"/>
      <stop offset="0.8" stop-color="#ff7b2e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff7b2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset="0.6" stop-color="#ffb347" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ff7b2e" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.8"/></filter>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#glow)"/>
  <!-- The disk seen from above: a lit face and its rim, which passes below the
       hole rather than in front of it at this tilt. -->
  <ellipse cx="100" cy="100" rx="86" ry="40" fill="url(#face)"/>
  <ellipse cx="100" cy="100" rx="86" ry="40" fill="none" stroke="url(#disk)" stroke-width="8" filter="url(#soft)"/>
  <circle cx="100" cy="100" r="37" fill="none" stroke="url(#arc)" stroke-width="5" filter="url(#soft)"/>
  <circle cx="100" cy="100" r="31.5" fill="none" stroke="#fff3d6" stroke-opacity="0.9" stroke-width="1.6"/>
  <circle cx="100" cy="100" r="30" fill="#000"/>
</svg>
