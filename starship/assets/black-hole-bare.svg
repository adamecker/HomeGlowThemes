<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.3" stop-color="#ffd59a" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#ff9b5e" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ff9b5e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#glow)"/>
  <!-- No disk: only the light that skims the edge, a thin photon ring. -->
  <circle cx="100" cy="100" r="33" fill="none" stroke="#ffe9c4" stroke-opacity="0.55" stroke-width="3" filter="url(#soft)"/>
  <circle cx="100" cy="100" r="31.5" fill="none" stroke="#fff8ec" stroke-opacity="0.95" stroke-width="1.2"/>
  <circle cx="100" cy="100" r="30" fill="#000"/>
</svg>
